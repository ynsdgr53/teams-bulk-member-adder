name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Teams_Bulk_Member_Adder_Windows.exe
            asset_name: Teams_Bulk_Member_Adder_Windows.exe
            build_cmd: pyinstaller --onefile --noconsole --name "Teams_Bulk_Member_Adder_Windows" --collect-all customtkinter src/main.py
            output_path: dist/Teams_Bulk_Member_Adder_Windows.exe

          - os: ubuntu-latest
            artifact_name: Teams_Bulk_Member_Adder_Linux
            asset_name: Teams_Bulk_Member_Adder_Linux
            build_cmd: pyinstaller --onefile --noconsole --name "Teams_Bulk_Member_Adder_Linux" --collect-all customtkinter src/main.py
            output_path: dist/Teams_Bulk_Member_Adder_Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xclip xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests

      - name: Build Executable with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
