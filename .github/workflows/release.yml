name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --noconsole --name "Teams_Bulk_Member_Adder" --collect-all customtkinter src/main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teams_Bulk_Member_Adder_Windows
          path: dist/Teams_Bulk_Member_Adder.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Teams_Bulk_Member_Adder.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
